<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — BloomScape Events</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F8F4EF; font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: #fff; max-width: 540px; width: 100%; padding: 3.5rem 3rem; text-align: center; border-top: 3px solid #C9795E; }
  .icon { font-size: 2.5rem; margin-bottom: 1.5rem; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; color: #3D3D3D; margin-bottom: 1rem; }
  p { font-size: 0.95rem; color: #6b6258; line-height: 1.8; margin-bottom: 2rem; }
  a { display: inline-block; font-family: 'Jost', sans-serif; font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: #fff; background: #C9795E; padding: 0.9rem 2rem; text-decoration: none; transition: background 0.3s; }
  a:hover { background: #B49A82; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🌸</div>
    <h1>Thank You!</h1>
    <p>Your inquiry has been received.<br>We'll be in touch within 24 hours to discuss your event.</p>
    <a href="https://bloomscapeevents.com">Back to BloomScape</a>
  </div>
</body>
</html>
